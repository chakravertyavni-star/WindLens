# Render Blueprint (Infrastructure as Code) — optional.
# Connect repo in Render Dashboard → New → Blueprint, or apply this file after linking GitHub.
# Verified against Render docs (Oct 2025): free web services spin down after 15 min idle;
# bind to $PORT (default 10000). User must approve deploy — nothing runs automatically from this file alone.

services:
  - type: web
    name: windlens
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.public
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ELEXON_SOURCE_CACHE_TTL_SECONDS
        value: "3600"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
