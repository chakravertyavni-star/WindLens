# Local production-style stack: nginx (SPA + /api proxy) + FastAPI backend.
# Not deployed automatically — run: docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ELEXON_SOURCE_CACHE_TTL_SECONDS: "3600"
      # CORS only needed for split-origin browsers; same-origin via nginx does not require it.
      CORS_ALLOWED_ORIGINS: "*"
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
